<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>바다줍Go 관리자 콘솔</title>
  <style>
    :root{--p:#087e8b;--danger:#e63946;--bg:#f4f8fa;--text:#18323d;--border:#dce6ea}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.head{background:linear-gradient(120deg,#075c68,#087e8b);color:#fff;padding:22px 16px}.wrap{max-width:850px;margin:auto;padding:16px}.card{background:#fff;border:1px solid var(--border);border-radius:15px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #18323d0a}h1{font-size:24px;margin:0}h2{font-size:19px;margin:2px 0 12px}p{line-height:1.55}button,input{font:inherit}button{min-height:44px;padding:0 14px;border:0;border-radius:10px;background:var(--p);color:#fff;font-weight:700;cursor:pointer}.danger{background:var(--danger)}.outline{background:#fff;color:var(--p);border:1px solid var(--p)}input{width:100%;min-height:44px;border:1px solid var(--border);border-radius:10px;padding:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.photo{width:100%;height:180px;object-fit:cover;border-radius:10px;background:#e8f0f2}.tag{display:inline-block;padding:4px 9px;border-radius:20px;background:#fff4d7;color:#765300;font-size:12px;font-weight:700}.notice{padding:12px;background:#edf9fa;border-left:4px solid var(--p);border-radius:6px}.muted{color:#667881}.empty{text-align:center;padding:32px;color:#667881}@media(max-width:550px){.grid{grid-template-columns:1fr}.photo{height:150px}}
  </style>
</head>
<body>
  <header class="head"><div class="wrap"><h1>바다줍Go 관리자 콘솔</h1><p style="margin:7px 0 0;opacity:.85">청소 인증 검토 전용 화면</p></div></header>
  <main id="app" class="wrap"></main>
  <script type="module">
    import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js';
    import {getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';
    import {getFirestore,collection,getDocs,query,where,updateDoc,getDoc,setDoc,doc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js';

    const config={apiKey:'AIzaSyCD8ZA1uYLPp_DOPsuOj71L9QdawK6cJP8',authDomain:'badajupgo.firebaseapp.com',projectId:'badajupgo',storageBucket:'badajupgo.firebasestorage.app',messagingSenderId:'713258815679',appId:'1:713258815679:web:7a07ac801a4dba3e7cf60a'};
    const auth=getAuth(initializeApp(config)),db=getFirestore();
    const ADMIN_EMAIL='admin@badajupgo.local',ADMIN_PASSWORD='bada2026!';
    const app=document.getElementById('app');
    const esc=value=>String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const distance=value=>Number(value||0).toLocaleString('ko-KR');

    function loginView(){
      app.innerHTML='<section class="card"><h2>관리자 로그인</h2><p class="muted">청소 인증 검토 권한이 있는 운영자만 접속할 수 있습니다.</p><label for="password">관리자 암호</label><div style="display:flex;gap:8px"><input id="password" type="password" autocomplete="current-password"><button id="togglePassword" type="button" class="outline" aria-label="비밀번호 표시" title="비밀번호 표시" style="width:46px;padding:0">◉</button></div><p id="loginError" class="muted" aria-live="polite"></p><button id="loginButton" style="width:100%;margin-top:12px">로그인</button></section>';
      const password=document.getElementById('password');
      document.getElementById('togglePassword').onclick=()=>{password.type=password.type==='password'?'text':'password'};
      document.getElementById('loginButton').onclick=login;
    }

    async function login(){
      const password=document.getElementById('password').value;
      if(password!==ADMIN_PASSWORD){alert('암호가 올바르지 않습니다.');return}
      try{
        await signInWithEmailAndPassword(auth,ADMIN_EMAIL,ADMIN_PASSWORD);
      }catch(error){
        if(error.code==='auth/user-not-found') await createUserWithEmailAndPassword(auth,ADMIN_EMAIL,ADMIN_PASSWORD);
        else {document.getElementById('loginError').textContent='관리자 인증에 실패했습니다: '+error.message;return}
      }
      await dashboard();
    }

    async function dashboard(){
      if(!auth.currentUser){loginView();return}
      app.innerHTML='<section class="card empty">검토 요청을 불러오는 중입니다.</section>';
      try{
        const snapshot=await getDocs(collection(db,'reviewRequests'));
        const allRequests=snapshot.docs.map(item=>({id:item.id,...item.data()}));
        for(const request of allRequests.filter(item=>item.status==='approved'&&!item.rewardPaid)) await grantReward(request);
        const requests=(await Promise.all(allRequests.filter(item=>item.status==='pending').map(async request=>{
          const reportSnap=await getDoc(doc(db,'reports',request.reportId));
          const reporterEmail=reportSnap.exists()?(reportSnap.data().reporterEmail||''):'',cleanerEmail=request.reporterEmail||'';
          if(reporterEmail&&cleanerEmail&&reporterEmail.toLowerCase()===cleanerEmail.toLowerCase()){
            await rejectSameAccount(request);
            request.status='rejected';
            request.rejectionReason='신고자와 청소 인증자의 Google 계정이 동일하여 자동 반려되었습니다.';
            request.reviewedAt=new Date().toISOString();
            return null;
          }
          return {...request,cleanerEmail:cleanerEmail||'알 수 없음',reporterEmail:reporterEmail||'알 수 없음'};
        }))).filter(Boolean);
        app.innerHTML='<section class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>청소 인증 검토</h2><span class="tag">'+requests.length+'건 대기</span></div><p class="notice">모바일과 PC에서 제출된 인증 요청을 함께 표시합니다.</p></section>'+(requests.length?requests.map(request=>'<section class="card"><div class="grid"><div><small>신고 전 사진</small><img class="photo" src="'+esc(request.beforeImage)+'" alt="신고 전 사진"></div><div><small>청소 후 사진</small><img class="photo" src="'+esc(request.afterImage)+'" alt="청소 후 사진"></div></div><p><b>신고 번호: '+esc(request.reportId)+'</b><br><span class="muted">신고자 Google 계정: '+esc(request.reporterEmail)+'<br>청소 인증자 Google 계정: '+esc(request.cleanerEmail)+'<br>인증 거리: '+distance(request.distance)+'m · 제출: '+esc(new Date(request.createdAt).toLocaleString('ko-KR'))+'</span><br>'+esc(request.description)+'</p><button data-action="approved" data-id="'+esc(request.id)+'">승인</button> <button class="danger" data-action="rejected" data-id="'+esc(request.id)+'">반려</button></section>').join(''):'<section class="card empty">검토 대기 중인 청소 인증이 없습니다.</section>')+'<section class="card"><button class="outline" id="logoutButton">로그아웃</button> <a href="index.html" style="margin-left:10px;color:#087e8b">사용자 화면으로</a></section>';
        const history=allRequests.filter(item=>item.status==='approved'||item.status==='rejected').sort((a,b)=>new Date(b.reviewedAt||b.createdAt)-new Date(a.reviewedAt||a.createdAt));
        const reportSnapshot=await getDocs(collection(db,'reports'));
        const waitingReports=reportSnapshot.docs.map(item=>({id:item.id,...item.data()})).filter(item=>item.status==='reported').sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
        const historyPanel='<section class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>승인 · 반려 처리 이력</h2><span class="tag">'+history.length+'건</span></div>'+(history.length?history.map(item=>'<p style="padding:10px 0;border-top:1px solid #dce6ea"><b>'+(item.status==='approved'?'승인 · 100P 지급':'반려')+'</b><br><span class="muted">인증 번호: '+esc(item.id)+' · 처리: '+esc(new Date(item.reviewedAt||item.createdAt).toLocaleString('ko-KR'))+(item.rejectionReason?'<br>반려 사유: '+esc(item.rejectionReason):'')+'</span></p>').join(''):'<p class="muted">처리 이력이 없습니다.</p>')+'</section>';
        const waitingPanel='<section class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>청소 대기 신고</h2><span class="tag">'+waitingReports.length+'건</span></div><p class="notice">신고는 접수되었지만 아직 청소 인증이 제출되지 않은 목록입니다.</p>'+(waitingReports.length?waitingReports.map(item=>'<p style="padding:10px 0;border-top:1px solid #dce6ea"><b>'+esc(item.district)+' · '+esc(item.trashType)+'</b><br><span class="muted">신고자: '+esc(item.reporterEmail||'알 수 없음')+' · '+esc(new Date(item.createdAt).toLocaleString('ko-KR'))+'</span><br>'+esc(item.description)+'</p>').join(''):'<p class="muted">청소 대기 신고가 없습니다.</p>')+'</section>';
        app.insertAdjacentHTML('beforeend',historyPanel+waitingPanel);
        document.querySelectorAll('[data-action]').forEach(button=>button.onclick=()=>review(button.dataset.id,button.dataset.action));
        document.getElementById('logoutButton').onclick=async()=>{await signOut(auth);loginView()};
      }catch(error){
        app.innerHTML='<section class="card empty">검토 요청을 불러오지 못했습니다.<br><small>'+esc(error.message)+'</small></section>';
      }
    }

    async function rejectSameAccount(request){
      const reason='신고자와 청소 인증자의 Google 계정이 동일하여 자동 반려되었습니다.';
      const userRef=doc(db,'users',request.reporterId),userSnap=await getDoc(userRef);
      const appData=userSnap.exists()?(userSnap.data().appData||{}):{};
      const verifications=(appData.verifications||[]).map(item=>item.id===request.id?{...item,status:'rejected',rejectionReason:reason,reviewedAt:new Date().toISOString()}:item);
      await setDoc(userRef,{appData:{...appData,verifications},updatedAt:serverTimestamp()},{merge:true});
      await updateDoc(doc(db,'reviewRequests',request.id),{status:'rejected',rejectionReason:reason,reviewedAt:new Date().toISOString()});
    }

    async function grantReward(request){
      if(!request.reporterId) throw new Error('포인트를 받을 사용자를 찾을 수 없습니다.');
      const userRef=doc(db,'users',request.reporterId);
      const userSnap=await getDoc(userRef);
      const appData=userSnap.exists()?(userSnap.data().appData||{}):{};
      const user=appData.user||{};
      const verifications=(appData.verifications||[]).map(item=>item.id===request.id?{...item,status:'approved',rewardPaid:true,reviewedAt:new Date().toISOString()}:item);
      await setDoc(userRef,{appData:{...appData,user:{...user,points:(Number(user.points)||0)+100,totalEarned:(Number(user.totalEarned)||0)+100},verifications},updatedAt:serverTimestamp()},{merge:true});
      await updateDoc(doc(db,'reviewRequests',request.id),{rewardPaid:true,rewardedAt:new Date().toISOString()});
    }

    async function review(id,status){
      if(!confirm(status==='approved'?'이 인증을 승인하고 100P를 지급할까요?':'이 인증을 반려할까요?')) return;
      try{
        const requestRef=doc(db,'reviewRequests',id);
        const requestSnap=await getDoc(requestRef);
        if(!requestSnap.exists()) throw new Error('인증 요청을 찾을 수 없습니다.');
        const request={id,...requestSnap.data()};
        if(status==='approved'&&!request.rewardPaid) await grantReward(request);
        await updateDoc(requestRef,{status,rewardPaid:status==='approved'||request.rewardPaid===true,reviewedAt:new Date().toISOString()});
        await dashboard();
      }catch(error){alert('처리하지 못했습니다: '+error.message)}
    }
    loginView();
  </script>
</body>
</html>
