<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>바다줍Go 관리자 콘솔</title><style>
:root{--p:#087E8B;--danger:#E63946;--ok:#2A9D55;--bg:#f4f8fa;--text:#18323d;--border:#dce6ea}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.head{background:#18323d;color:white;padding:22px 16px}.wrap{max-width:850px;margin:auto;padding:16px}.card{background:#fff;border:1px solid var(--border);border-radius:15px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #18323d0a}h1{font-size:24px;margin:0}h2{font-size:19px;margin:2px 0 12px}p{line-height:1.55}button,input{font:inherit}button{min-height:44px;padding:0 14px;border:0;border-radius:10px;background:var(--p);color:#fff;font-weight:700;cursor:pointer}.danger{background:var(--danger)}.outline{background:#fff;color:var(--p);border:1px solid var(--p)}input{width:100%;min-height:44px;border:1px solid var(--border);border-radius:10px;padding:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.photo{width:100%;height:180px;object-fit:cover;border-radius:10px;background:#e8f0f2}.tag{display:inline-block;padding:4px 9px;border-radius:20px;background:#fff4d7;color:#765300;font-size:12px;font-weight:bold}.notice{padding:12px;background:#edf9fa;border-left:4px solid var(--p);border-radius:6px}.muted{color:#667881}.empty{text-align:center;padding:32px;color:#667881}@media(max-width:550px){.grid{grid-template-columns:1fr}.photo{height:150px}}
</style></head><body><header class="head"><div class="wrap"><h1>바다줍Go 관리자 콘솔</h1><p style="margin:7px 0 0;opacity:.85">청소 인증 검토 전용 화면</p></div></header><main id="app" class="wrap"></main><script>
const KEY='cleanSeaBusan_safe_v2', PASS='bada2026!';
const e=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch{return null}}function save(d){localStorage.setItem(KEY,JSON.stringify(d))}function fmt(n){return Number(n||0).toLocaleString('ko-KR')}
function login(){app.innerHTML='<section class="card"><h2>관리자 로그인</h2><p class="muted">청소 인증 검토 권한이 있는 운영자만 접속할 수 있습니다.</p><label for="pass">관리자 암호</label><div style="display:flex;gap:8px"><input id="pass" type="password" autocomplete="current-password"><button id="showPass" type="button" class="outline" aria-label="비밀번호 표시">표시</button></div><button id="enter" style="width:100%;margin-top:12px">로그인</button></section>';showPass.onclick=()=>{let visible=pass.type==='text';pass.type=visible?'password':'text';showPass.textContent=visible?'표시':'숨김';showPass.setAttribute('aria-label',visible?'비밀번호 표시':'비밀번호 숨김')};enter.onclick=()=>{if(pass.value===PASS){sessionStorage.setItem('badaAdmin','yes');dashboard()}else alert('암호가 올바르지 않습니다.')}}
function dashboard(){let d=load();if(!d){app.innerHTML='<section class="card empty">사용자 데이터가 없습니다. 먼저 사용자 화면에서 신고 또는 청소 인증을 등록해 주세요.</section>';return}let list=(d.verifications||[]).filter(v=>v.status==='pending');app.innerHTML='<section class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>청소 인증 검토</h2><span class="tag">'+list.length+'건 대기</span></div><p class="notice">신고 전·후 사진, 위치 거리, 설명을 확인한 뒤 처리하세요. 승인 시 신고가 청소 완료로 바뀌고 100P가 지급됩니다.</p></section>'+(list.length?list.map(v=>{let r=(d.reports||[]).find(x=>x.id===v.reportId)||{};return '<section class="card"><div class="grid"><div><small>신고 전 사진</small><img class="photo" src="'+(v.beforeImage||r.image||'')+'" alt="신고 전 사진"></div><div><small>청소 후 사진</small><img class="photo" src="'+(v.afterImage||'')+'" alt="청소 후 사진"></div></div><p><b>'+e(r.district)+' · '+e(r.trashType)+'</b><br><span class="muted">인증 거리: '+fmt(v.distance)+'m · 제출: '+new Date(v.createdAt).toLocaleString('ko-KR')+'</span><br>'+e(v.description)+'</p><button onclick="approve(\''+v.id+'\')">승인 · 100P 지급</button> <button class="danger" onclick="reject(\''+v.id+'\')">반려</button></section>'}).join(''):'<section class="card empty">검토 대기 중인 청소 인증이 없습니다.</section>')+'<section class="card"><button class="outline" onclick="logout()">로그아웃</button> <a href="index.html" style="margin-left:10px;color:#087E8B">사용자 화면으로</a></section>'}
function approve(id){let d=load(),v=d.verifications.find(x=>x.id===id);if(!v||v.status!=='pending'||!confirm('이 인증을 승인하고 100P를 지급할까요?'))return;v.status='approved';v.reviewedAt=new Date().toISOString();let r=d.reports.find(x=>x.id===v.reportId);if(r){r.status='cleaned';r.cleanedAt=new Date().toISOString()}if(!v.rewardPaid){v.rewardPaid=true;d.user.points=(d.user.points||0)+100;d.user.totalEarned=(d.user.totalEarned||0)+100}save(d);alert('승인했습니다.');dashboard()}
function reject(id){let d=load(),v=d.verifications.find(x=>x.id===id),reason=prompt('반려 사유를 입력해 주세요.');if(!v||v.status!=='pending'||reason===null)return;v.status='rejected';v.rejectionReason=reason;v.reviewedAt=new Date().toISOString();let r=d.reports.find(x=>x.id===v.reportId);if(r)r.status='reported';save(d);alert('반려했습니다.');dashboard()}
function logout(){sessionStorage.removeItem('badaAdmin');login()}if(sessionStorage.getItem('badaAdmin')==='yes')dashboard();else login();
</script></main></body></html>
