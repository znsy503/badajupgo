ound:#fff5d9}.cleaned{color:#17683a;background:#e5f6ea}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:3px}.tabs button{white-space:nowrap}.tabs .active{background:var(--text)}label{font-weight:700;display:block;margin:13px 0 5px}input,select,textarea{width:100%;min-height:44px;border:1px solid var(--border);border-radius:10px;padding:10px;background:#fff;color:var(--text)}textarea{min-height:90px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.preview{max-height:210px;max-width:100%;border-radius:12px;margin-top:9px}.notice{padding:11px;border-left:4px solid var(--primary);background:#edf9fa;border-radius:6px;margin:10px 0}.warning{border-color:var(--warning);background:#fff9e8}.map{height:410px;border-radius:13px;overflow:hidden;background:#dce9e8}.fallback{padding:25px;text-align:center}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.filters select{font-size:13px}.bottom{position:fixed;z-index:999;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);height:70px;display:flex;justify-content:center}.bottom button{flex:1;max-width:190px;border-radius:0;background:#fff;color:var(--muted);font-size:12px;padding:4px}.bottom button.active{color:var(--primary);box-shadow:inset 0 3px var(--primary)}.admin{background:#18323d;color:#fff}.admin-card{border-left:4px solid var(--warning)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.spacer{display:flex;justify-content:space-between;gap:8px;align-items:center}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:2000;min-width:220px;text-align:center;background:#18323d;color:#fff;border-radius:10px;padding:12px;display:none}.empty{text-align:center;color:var(--muted);padding:20px}@media(max-width:560px){.wrap{padding:12px}.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.map{height:360px}.bar-row{grid-template-columns:62px 1fr 63px}.top{padding:18px 12px 24px}}
</style></head><body>
<header class="top"><div class="wrap"><h1>바다줍Go <small>BadaJupGo</small></h1><p>시민과 함께 만드는 깨끗한 부산 해변</p></div></header><main id="app" class="wrap"></main><nav class="bottom" aria-label="주요 메뉴"><button data-page="home">⌂<br>홈</button><button data-page="map">⌖<br>해변 지도</button><button data-page="report">＋<br>신고</button><button data-page="activity">☷<br>활동</button><button data-page="my">♙<br>마이페이지</button></nav><div class="toast" id="toast" role="status"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>/*
const BUSAN_2023_STATS=[
{id:'jung',district:'중구',fullName:'부산광역시 중구',value2023:0,latitude:35.1063,longitude:129.0324},{id:'seo',district:'서구',fullName:'부산광역시 서구',value2023:597,latitude:35.0979,longitude:129.0244},{id:'dong',district:'동구',fullName:'부산광역시 동구',value2023:0,latitude:35.1293,longitude:129.0454},{id:'yeongdo',district:'영도구',fullName:'부산광역시 영도구',value2023:149.7,latitude:35.0912,longitude:129.0679},{id:'nam',district:'남구',fullName:'부산광역시 남구',value2023:13.3,latitude:35.1366,longitude:129.0844},{id:'haeundae',district:'해운대구',fullName:'부산광역시 해운대구',value2023:255.1,latitude:35.1631,longitude:129.1635},{id:'saha',district:'사하구',fullName:'부산광역시 사하구',value2023:1332.4,latitude:35.1046,longitude:128.9747},{id:'gangseo',district:'강서구',fullName:'부산광역시 강서구',value2023:61,latitude:35.2122,longitude:128.9806},{id:'suyeong',district:'수영구',fullName:'부산광역시 수영구',value2023:66.5,latitude:35.1457,longitude:129.1132},{id:'gijang',district:'기장군',fullName:'부산광역시 기장군',value2023:1561.8,latitude:35.2446,longitude:129.2223},{id:'port',district:'항만관리사업소',fullName:'부산광역시 항만관리사업소',value2023:0,latitude:35.1128,longitude:129.0414},{id:'other',district:'기타',fullName:'기타 지역',value2023:24.2,latitude:35.1796,longitude:129.0756}];
const K='cleanSeaBusan_v1',districts=['중구','서구','동구','영도구','남구','해운대구','사하구','강서구','수영구','기장군','기타'];let page='home',map;
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const fmt=n=>Number(n).toLocaleString('ko-KR');const date=s=>new Intl.DateTimeFormat('ko-KR',{dateStyle:'medium',timeStyle:'short'}).format(new Date(s));const statText=s=>({reported:'신고됨',reviewing:'청소 인증 검토 중',cleaned:'청소 완료'}[s]||s);const status=s=>`<span class="tag ${s}">${statText(s)}</span>`;const uid=p=>p+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
function svg(label,color='#087E8B'){return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="240" height="150"><rect width="100%" height="100%" fill="${color}"/><path d="M0 100 Q60 75 120 100T240 100V150H0" fill="#bce9ec"/><text x="120" y="70" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18">${label}</text></svg>`)}
function seed(){let now=Date.now(), spots=[['광안리 해변','수영구',35.153,129.119,'플라스틱','많음','reported'],['해운대','해운대구',35.158,129.160,'스티로폼','보통','reviewing'],['송정','해운대구',35.179,129.200,'유리','적음','cleaned'],['다대포','사하구',35.046,128.966,'캔 및 금속','많음','reported'],['영도','영도구',35.079,129.071,'낚시 용구','보통','cleaned'],['오륙도','남구',35.100,129.122,'비닐','적음','reviewing'],['을숙도','사하구',35.107,128.958,'생활 쓰레기','많음','reported'],['기장','기장군',35.237,129.214,'플라스틱','보통','cleaned']];return {reports:spots.map((x,i)=>({id:'report_sample_'+i,image:svg(x[0],i%2?'#2EC4B6':'#087E8B'),latitude:x[2],longitude:x[3],accuracy:18,district:x[1],trashType:x[4],trashAmount:x[5],description:x[0]+' 주변 해안에 쓰레기가 확인되었습니다.',status:x[6],createdAt:new Date(now-(i+1)*864e5).toISOString(),cleanedAt:x[6]=='cleaned'?new Date(now-i*864e5).toISOString():null})),verifications:[],user:{nickname:'부산바다 지킴이',points:0,totalEarned:0,totalSpent:0},points:[],exchanges:[],admin:false}}
function load(){try{return JSON.parse(localStorage.getItem(K))||seed()}catch{return seed()}}let db=load();function save(){localStorage.setItem(K,JSON.stringify(db))}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2800)}
function summary(){let a=[...BUSAN_2023_STATS].sort((x,y)=>y.value2023-x.value2023),sum=a.reduce((s,x)=>s+x.value2023,0);return {a,sum,zero:a.filter(x=>!x.value2023)}}function reportItem(r,action=true){return `<div class="item"><img class="thumb" src="${r.image}" alt="${esc(r.district)} 신고 사진"><div style="flex:1"><b>${esc(r.district)} · ${esc(r.trashType)}</b><br>${status(r.status)} <small>${date(r.createdAt)}</small><br><small>${esc(r.description)}</small>${action?`<br><button class="outline" style="margin-top:8px" onclick="openVerify('${r.id}')">청소 인증하기</button>`:''}</div></div>`}
function home(){let s=summary(), reports=db.reports, counts=['reported','reviewing','cleaned'].map(x=>reports.filter(r=>r.status==x).length);return `<section class="card"><h2>부산 바다를 함께 지켜요</h2><p class="muted">해양 쓰레기를 신고하고 청소 전후 사진 인증으로 변화를 기록하세요.</p><div class="grid"><div class="metric"><small>미처리 신고</small><b>${counts[0]}</b></div><div class="metric"><small>검토 중</small><b>${counts[1]}</b></div><div class="metric"><small>청소 완료</small><b>${counts[2]}</b></div><div class="metric"><small>보유 포인트</small><b>${fmt(db.user.points)}P</b></div></div></section><section class="card"><h2>2023 해양쓰레기 통계 요약</h2><p>최다 <b>${s.a[0].district} ${fmt(s.a[0].value2023)}</b> · 두 번째 <b>${s.a[1].district} ${fmt(s.a[1].value2023)}</b><br>합계 <b>${fmt(s.sum)}</b> · 0인 지역 <b>${s.zero.map(x=>x.district).join(', ')}</b></p><div>${s.a.map(x=>`<div class="bar-row"><small>${x.district}</small><div class="bar"><i style="width:${x.value2023/s.a[0].value2023*100}%"></i></div><small>${fmt(x.value2023)}</small></div>`).join('')}</div><small class="muted">자료 출처: 사용자 제공 부산광역시 구·군·사업소별 해양쓰레기 통계자료, 2023년 기준 · 단위는 원자료 단위</small></section><section class="card"><h2>빠른 실행</h2><div class="quick"><button onclick="go('report')">쓰레기 신고하기</button><button onclick="go('map')">내 주변 지도 보기</button><button onclick="go('activity')">청소 인증 내역</button></div></section><section class="card"><h2>최근 시민 신고</h2>${reports.slice(0,3).map(r=>reportItem(r)).join('')}</section><section class="card"><h2>최근 청소 완료</h2>${reports.filter(r=>r.status==='cleaned').slice(0,3).map(r=>reportItem(r,false)).join('')||'<div class="empty">아직 완료된 청소가 없습니다.</div>'}</section>`}
function report(){return `<section class="card"><h2>해양 쓰레기 신고</h2><p class="muted">사진과 위치를 남겨 정확한 정화 활동을 도와주세요.</p><form id="reportForm"><label>현장 사진 *</label><input id="photo" type="file" accept="image/*" capture="environment" required aria-label="현장 사진 선택 또는 촬영"><img id="preview" class="preview" hidden alt="선택한 현장 사진 미리보기"><label>GPS 위치</label><div class="row"><button type="button" onclick="getPosition('report')">현재 위치 가져오기</button><small id="gpsText" class="muted">직접 지역을 선택할 수도 있어요.</small></div><div class="two"><div><label>위도</label><input id="lat" type="number" step="any" placeholder="예: 35.1796"></div><div><label>경도</label><input id="lng" type="number" step="any" placeholder="예: 129.0756"></div></div><label>지역 *</label><select id="district" required>${districts.map(x=>`<option>${x}</option>`).join('')}</select><div class="two"><div><label>쓰레기 종류 *</label><select id="trashType">${['플라스틱','낚시 용구','스티로폼','유리','캔 및 금속','비닐','생활 쓰레기','기타'].map(x=>`<option>${x}</option>`).join('')}</select></div><div><label>쓰레기 양 *</label><select id="amount"><option>적음</option><option>보통</option><option>많음</option></select></div></div><label>상세 설명 *</label><textarea id="desc" required maxlength="500" placeholder="발견 장소와 쓰레기 상태를 알려주세요."></textarea><button id="submitReport" type="submit" style="width:100%;margin-top:16px">신고 등록</button></form></section>`}
function mapPage(){return `<section class="card"><div class="spacer"><h2>부산 쓰레기 지도</h2><button class="outline" onclick="getPosition('map')">내 위치</button></div><p class="notice">2023 통계값은 과거 집계 자료이고, 시민 신고 마커는 현재 서비스에 등록된 데이터입니다.</p><div class="tabs"><button class="active" id="allLayer" onclick="drawMap('all')">함께 보기</button><button id="statLayer" onclick="drawMap('stat')">2023 통계</button><button id="reportLayer" onclick="drawMap('report')">실시간 신고</button></div><div class="filters"><select id="fstatus" onchange="drawMap('report')"><option value="">전체 상태</option><option value="reported">미처리</option><option value="reviewing">검토 중</option><option value="cleaned">청소 완료</option></select><select id="ftype" onchange="drawMap('report')"><option value="">전체 종류</option>${['플라스틱','낚시 용구','스티로폼','유리','캔 및 금속','비닐','생활 쓰레기','기타'].map(x=>`<option>${x}</option>`).join('')}</select><select id="fdistrict" onchange="drawMap('report')"><option value="">전체 지역</option>${districts.map(x=>`<option>${x}</option>`).join('')}</select></div><div id="map" class="map" style="margin-top:10px"></div></section><section class="card"><h2>신고 목록</h2>${db.reports.map(r=>reportItem(r)).join('')}</section>`}
function activity(){return `<section class="card"><h2>나의 활동</h2><div class="tabs"><button class="active" onclick="activityTab('r')">시민 신고</button><button onclick="activityTab('v')">청소 인증</button><button onclick="activityTab('e')">교환 요청</button></div><div id="activityList">${db.reports.map(r=>reportItem(r)).join('')}</div></section>`}
function my(){let progress=Math.min(100,db.user.points/5000*100);return `<section class="card"><div class="spacer"><div><h2>${esc(db.user.nickname)}</h2><span class="muted">시민 참여자</span></div><button class="outline" onclick="toggleAdmin()">${db.admin?'관리자 모드 끄기':'관리자 모드 켜기'}</button></div><div class="grid"><div class="metric"><small>현재 포인트</small><b>${fmt(db.user.points)}P</b></div><div class="metric"><small>총 적립</small><b>${fmt(db.user.totalEarned)}P</b></div><div class="metric"><small>총 사용</small><b>${fmt(db.user.totalSpent)}P</b></div><div class="metric"><small>교환까지</small><b>${fmt(Math.max(0,5000-db.user.points))}P</b></div></div><label>기프트콘 교환 진행률</label><div class="bar"><i style="width:${progress}%"></i></div><small>${progress.toFixed(1)}% (5,000P 기준)</small></section><section class="card"><h2>기프트콘 교환</h2>${['편의점 5,000원권','카페 음료권'].map(x=>`<div class="item"><div style="flex:1"><b>${x}</b><br><small>5,000 포인트 · 실제 발송되지 않는 데모입니다.</small></div><button ${db.user.points<5000?'disabled':''} onclick="requestGift('${x}')">교환 신청</button></div>`).join('')}</section><section class="card"><h2>포인트 내역</h2>${db.points.length?db.points.map(x=>`<div class="item"><div style="flex:1"><b>${esc(x.description)}</b><br><small>${date(x.createdAt)} · ${esc(x.relatedId)}</small></div><b>${x.amount>0?'+':''}${fmt(x.amount)}P</b></div>`).join(''):'<div class="empty">아직 포인트 내역이 없습니다.</div>'}</section>${db.admin?adminPanel():''}<section class="card"><h2>서비스 및 데이터 안내</h2><p>시민 신고 데이터와 2023 공식 통계는 서로 다른 레이어로 관리되며 합산하지 않습니다. 통계는 제공된 일부 지역만 포함합니다.</p><p>이 버전은 localStorage 기반 프로토타입이며 실제 백엔드가 없습니다. 실제 서비스에는 서버, 회원 인증, 관리자 권한, 사진 저장소와 개인정보 보호 기능이 필요합니다. GPS는 기기·환경에 따라 오차가 발생할 수 있습니다.</p><button class="danger" onclick="resetDemo()">데모 데이터 초기화</button></section>`}
function adminPanel(){let pending=db.verifications.filter(v=>v.status==='pending');return `<section class="card admin-card"><h2>관리자 검토</h2><div class="grid"><div class="metric"><small>인증 대기</small><b>${pending.length}</b></div><div class="metric"><small>미처리 신고</small><b>${db.reports.filter(r=>r.status==='reported').length}</b></div><div class="metric"><small>청소 완료</small><b>${db.reports.filter(r=>r.status==='cleaned').length}</b></div><div class="metric"><small>교환 대기</small><b>${db.exchanges.filter(e=>e.status==='pending').length}</b></div></div><button onclick="demoPoints()">데모 포인트 5,000P 지급</button><h3 style="margin-top:16px">청소 인증 대기</h3>${pending.map(v=>verifyCard(v)).join('')||'<div class="empty">검토할 인증이 없습니다.</div>'}<h3>교환 요청</h3>${db.exchanges.map(e=>`<div class="item"><div style="flex:1"><b>${esc(e.product)}</b><br>${e.status} · ${date(e.createdAt)}</div>${e.status==='pending'?`<button onclick="approveGift('${e.id}')">승인</button><button class="danger" onclick="rejectGift('${e.id}')">반려/환불</button>`:''}</div>`).join('')||'<div class="empty">요청이 없습니다.</div>'}</section>`}
function verifyCard(v){let r=db.reports.find(x=>x.id===v.reportId);return `<div class="item"><img class="thumb" src="${v.beforeImage}" alt="신고 전 사진"><img class="thumb" src="${v.afterImage}" alt="청소 후 사진"><div style="flex:1"><b>${esc(r?.district||'')}</b> · ${fmt(v.distance)}m<br><small>${esc(v.description)}</small><br><button onclick="approveVerify('${v.id}')">승인</button> <button class="danger" onclick="rejectVerify('${v.id}')">반려</button></div></div>`}

/* Startup guard: old demo storage must never be able to blank the application. */
(function () {
  var STORE = 'cleanSeaBusan_safe_v2';
  function freshUser() { return { points: 0, totalEarned: 0, totalSpent: 0, residence: '' }; }
  function repairSavedData() {
    var value, changed = false;
    try { value = JSON.parse(localStorage.getItem(STORE)); } catch (_) { value = null; changed = true; }
    if (!value || typeof value !== 'object' || !Array.isArray(value.reports)) return false;
    if (!value.user || typeof value.user !== 'object') { value.user = freshUser(); changed = true; }
    ['points', 'totalEarned', 'totalSpent'].forEach(function (key) {
      if (!Number.isFinite(Number(value.user[key]))) { value.user[key] = 0; changed = true; }
    });
    if (!Array.isArray(value.verifications)) { value.verifications = []; changed = true; }
    if (!Array.isArray(value.exchanges)) { value.exchanges = []; changed = true; }
    if (changed) localStorage.setItem(STORE, JSON.stringify(value));
    return changed;
  }
  function emergencyHome() {
    var app = document.getElementById('app');
    if (!app || app.innerHTML.trim()) return;
    app.innerHTML = '<section class="card"><h2>바다줍Go를 준비하고 있어요</h2><p class="muted">저장된 데모 데이터를 안전하게 복구했습니다. 아래 버튼을 눌러 홈을 다시 열어 주세요.</p><button id="startupRetry" type="button">홈 다시 열기</button></section>';
    document.getElementById('startupRetry').onclick = function () { location.reload(); };
  }
  try {
    var repaired = repairSavedData();
    if (repaired) { location.reload(); return; }
    /* A later extension must not leave a usable page blank after an earlier render error. */
    setTimeout(function () {
      var app = document.getElementById('app');
      if (app && !app.innerHTML.trim()) {
        try { if (typeof window.cleanGo === 'function') window.cleanGo('home'); } catch (_) { emergencyHome(); }
        emergencyHome();
      }
    }, 0);
  } catch (_) { emergencyHome(); }
}());
